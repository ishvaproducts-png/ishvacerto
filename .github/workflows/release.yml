name: release

# Publishes to PyPI automatically when you publish a GitHub Release.
# Uses PyPI Trusted Publishing (OIDC) -- no API token stored anywhere.
#
# One-time PyPI setup (Trusted Publisher / "pending publisher"):
#   PyPI -> your project -> Publishing -> Add a trusted publisher (GitHub Actions):
#     Owner:               ishvaproducts-png
#     Repository:          ishvacerto
#     Workflow filename:   release.yml      <-- must match THIS file's name
#     Environment:         (leave blank)
# After that, cutting a GitHub Release triggers this workflow and it publishes.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  pypi-publish:
    name: build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # REQUIRED for Trusted Publishing (OIDC); no password/token needed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check artifacts
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
